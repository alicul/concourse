# A local topology for exercising Concourse across two isolated networks.
#
# AWS network:    PostgreSQL, the ATC/TSA, and two `aws` workers
# Office network: two `office` workers
# Network link:   a TCP-only relay from office to the TSA's SSH port
#
# Workers have exactly one network interface (apart from loopback), so
# Baggageclaim advertises an address that its same-network peers can reach.

x-worker-environment: &worker-environment
  CONCOURSE_RUNTIME: containerd
  CONCOURSE_TSA_PUBLIC_KEY: /concourse-keys/tsa_host_key.pub
  CONCOURSE_TSA_WORKER_PRIVATE_KEY: /concourse-keys/worker_key
  CONCOURSE_LOG_LEVEL: debug
  CONCOURSE_BIND_IP: 0.0.0.0
  CONCOURSE_BAGGAGECLAIM_BIND_IP: 0.0.0.0
  CONCOURSE_BAGGAGECLAIM_DRIVER: overlay
  CONCOURSE_BAGGAGECLAIM_P2P_INTERFACE_NAME_PATTERN: ^eth0
  CONCOURSE_BAGGAGECLAIM_P2P_INTERFACE_FAMILY: "4"
  CONCOURSE_CONTAINERD_DNS_PROXY_ENABLE: "true"

x-worker: &worker
  build: .
  image: concourse/concourse:local
  command: worker
  privileged: true
  cgroup: host
  expose:
    - "7777"
    - "7788"
  volumes:
    - ./hack/keys:/concourse-keys:ro
  stop_signal: SIGUSR2

services:
  db:
    image: postgres:${POSTGRES_TAG:-latest}
    shm_size: 1gb
    networks: [aws]
    environment:
      POSTGRES_DB: concourse
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_HOST_AUTH_METHOD: ${AUTH_METHOD:-trust}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dev -d concourse]
      interval: 3s
      timeout: 3s
      retries: 5

  # The combined ATC/TSA process lives only on the AWS network.
  web:
    build: .
    image: concourse/concourse:local
    command: web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [aws]
    volumes:
      - .:/src
      - ./hack/keys:/concourse-keys:ro
    environment:
      CONCOURSE_SESSION_SIGNING_KEY: /concourse-keys/session_signing_key
      CONCOURSE_TSA_AUTHORIZED_KEYS: /concourse-keys/authorized_worker_keys
      CONCOURSE_TSA_HOST_KEY: /concourse-keys/tsa_host_key
      CONCOURSE_LOG_LEVEL: debug
      CONCOURSE_POSTGRES_HOST: db
      CONCOURSE_POSTGRES_USER: dev
      CONCOURSE_POSTGRES_PASSWORD: dev
      CONCOURSE_POSTGRES_DATABASE: concourse
      CONCOURSE_EXTERNAL_URL: http://localhost:8080
      CONCOURSE_ADD_LOCAL_USER: test:test
      CONCOURSE_MAIN_TEAM_LOCAL_USER: test
      CONCOURSE_CLUSTER_NAME: office-aws
      CONCOURSE_ENABLE_P2P_VOLUME_STREAMING: "true"
      CONCOURSE_P2P_VOLUME_STREAMING_TIMEOUT: 15m
      CONCOURSE_ENABLE_CACHE_STREAMED_VOLUMES: "true"

  # This is the only service connected to both networks. It exposes only a
  # TCP relay to web:2222, which is sufficient for office worker registration
  # and the reverse worker tunnels carried by the TSA SSH session.
  office-tsa-gateway:
    image: alpine/socat:latest
    command:
      - -d
      - -d
      - TCP-LISTEN:2222,fork,reuseaddr
      - TCP:web:2222
    depends_on: [web]
    networks: [aws, office]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  aws-worker-1:
    <<: *worker
    depends_on: [web]
    networks: [aws]
    environment:
      <<: *worker-environment
      CONCOURSE_NAME: aws-worker-1
      CONCOURSE_TAG: aws,aws-1
      CONCOURSE_TSA_HOST: web:2222

  aws-worker-2:
    <<: *worker
    depends_on: [web]
    networks: [aws]
    environment:
      <<: *worker-environment
      CONCOURSE_NAME: aws-worker-2
      CONCOURSE_TAG: aws,aws-2
      CONCOURSE_TSA_HOST: web:2222

  office-worker-1:
    <<: *worker
    depends_on: [office-tsa-gateway]
    networks: [office]
    environment:
      <<: *worker-environment
      CONCOURSE_NAME: office-worker-1
      CONCOURSE_TAG: office,office-1
      CONCOURSE_TSA_HOST: office-tsa-gateway:2222

  office-worker-2:
    <<: *worker
    depends_on: [office-tsa-gateway]
    networks: [office]
    environment:
      <<: *worker-environment
      CONCOURSE_NAME: office-worker-2
      CONCOURSE_TAG: office,office-2
      CONCOURSE_TSA_HOST: office-tsa-gateway:2222

networks:
  aws:
    driver: bridge
  office:
    driver: bridge
